[workspace]
resolver = "2"
members = ["kjerne", "sky", "telefon", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
anyhow = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
